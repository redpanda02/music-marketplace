{% extends "base.html" %}
{% block title %}Login · MusicMarket{% endblock %}
{% block content %}

<div class="auth-card">
  <h2>Welcome Back</h2>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Your password"/>
    </div>
    <button type="submit" class="btn-primary full-width">Log In</button>
  </form>
  <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  <div class="demo-creds">
    <strong>Demo admin:</strong> admin@marketplace.com / admin123
  </div>
</div>

{% endblock %}

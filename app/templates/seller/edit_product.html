{% extends "base.html" %}
{% block title %}Edit {{ product.name }} · MusicMarket{% endblock %}
{% block content %}

<div class="form-card">
  <h2>Edit Product</h2>
  <form method="POST" action="{{ url_for('seller.edit_product', product_id=product.product_id) }}">
    <div class="form-group">
      <label>Product Name *</label>
      <input type="text" name="name" value="{{ product.name }}" required/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4">{{ product.description or '' }}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price ($) *</label>
        <input type="number" name="price" step="0.01" min="0.01"
               value="{{ product.price }}" required/>
      </div>
      <div class="form-group">
        <label>Stock Quantity *</label>
        <input type="number" name="stock_quantity" min="0"
               value="{{ product.stock_quantity }}" required/>
      </div>
    </div>
    <div class="form-group">
      <label>Category *</label>
      <select name="category_id" required>
        {% for cat in categories %}
          <option value="{{ cat.category_id }}"
            {% if cat.category_id == product.category_id %}selected{% endif %}>
            {{ cat.name }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}/>
        Product is active (visible in catalog)
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('seller.dashboard') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}

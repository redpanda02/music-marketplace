{% extends "base.html" %}
{% block title %}Register · MusicMarket{% endblock %}
{% block content %}

<div class="auth-card">
  <h2>Create an Account</h2>
  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" required placeholder="Your name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required placeholder="Min. 6 characters"/>
    </div>
    <div class="form-group">
      <label>Account Type</label>
      <select name="role">
        <option value="customer">Customer — browse and buy</option>
        <option value="seller">Seller — list and sell instruments</option>
      </select>
    </div>
    <button type="submit" class="btn-primary full-width">Create Account</button>
  </form>
  <p class="auth-link">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>

{% endblock %}
